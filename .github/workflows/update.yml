name: 공고 업데이트

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "audition-bot"
          git config user.email "audition-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "공고 업데이트" && git push)
