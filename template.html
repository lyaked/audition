<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>내 오디션 공고</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--line:#e4e0d8;--text:#1c1917;--sub:#78716c;--accent:#c2410c;--accent-bg:#fff1e8;--ok:#15803d;--ok-bg:#e9f7ee;--warn:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--card:#1f1c19;--line:#34302b;--text:#f1eee9;--sub:#a29a90;--accent:#fb923c;--accent-bg:#3a2214;--ok:#4ade80;--ok-bg:#15301f;--warn:#f87171}}
:root[data-theme="dark"]{--bg:#141210;--card:#1f1c19;--line:#34302b;--text:#f1eee9;--sub:#a29a90;--accent:#fb923c;--accent-bg:#3a2214;--ok:#4ade80;--ok-bg:#15301f;--warn:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.chip{padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.chip.direct{background:var(--accent-bg);border-color:transparent;color:var(--accent);font-weight:600}
.posted{margin-left:auto}
.card a.head{display:block;color:var(--text);text-decoration:none;font-weight:600;font-size:16px;margin:8px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:14px}
dt{color:var(--sub)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dday{font-weight:600}.dday.soon{color:var(--warn)}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a,.actions button{flex:1;text-align:center;padding:10px 0;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--text)}
.actions a{background:var(--text);color:var(--bg);border-color:var(--text)}
.actions button.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.empty{text-align:center;color:var(--sub);padding:48px 0}
</style>
</head>
<body>
<header>
  <h1>내 오디션 공고</h1>
  <div class="meta" id="meta"></div>
  <div class="tabs">
    <button id="tNew" aria-pressed="true">새 공고</button>
    <button id="tDone" aria-pressed="false">지원완료</button>
  </div>
</header>
<main id="list"></main>
<script>
const DATA = __DATA__;
const KEY = "fm-applied";
let applied = {};
try { applied = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(applied)); } catch (e) {} }
let view = "new";

function dday(deadline) {
  if (!deadline) return "";
  const t = new Date(); t.setHours(0,0,0,0);
  const d = Math.round((new Date(deadline + "T00:00:00") - t) / 864e5);
  return d === 0 ? "D-day" : d > 0 ? "D-" + d : "마감";
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const posts = DATA.posts.filter(p => view === "new" ? !applied[p.id] : applied[p.id]);
  const left = DATA.posts.filter(p => !applied[p.id]).length;
  document.getElementById("meta").textContent = `남자 · 32세 맞춤 · 지원할 공고 ${left}개 · ${DATA.updated} 업데이트`;
  document.getElementById("tNew").setAttribute("aria-pressed", view === "new");
  document.getElementById("tDone").setAttribute("aria-pressed", view === "done");
  if (!posts.length) { list.append(el("div", "empty", view === "new" ? "지금은 새 공고가 없어요 🎬" : "아직 지원완료로 표시한 공고가 없어요")); return; }
  for (const p of posts) {
    const c = el("article", "card");
    const top = el("div", "top");
    if (p.category) top.append(el("span", "chip", p.category));
    if (p.direct) top.append(el("span", "chip direct", "바로지원"));
    top.append(el("span", "posted", p.posted.slice(5)));
    const head = el("a", "head", p.headline); head.href = p.url; head.target = "_blank"; head.rel = "noopener";
    const dl = el("dl");
    const dd = dday(p.deadline);
    for (const [k, v] of [["작품", p.work], ["제작", p.producer], ["성별", p.gender], ["연령", p.age], ["출연료", p.pay]]) {
      if (v) dl.append(el("dt", null, k), el("dd", null, v));
    }
    if (p.deadline) {
      const v = el("dd"); const s = el("span", "dday" + (/^D-(day|[0-3])$/.test(dd) ? " soon" : ""), dd);
      v.append(s, document.createTextNode(" (" + p.deadline.slice(5) + ")"));
      dl.append(el("dt", null, "마감"), v);
    }
    const act = el("div", "actions");
    const go = el("a", null, "공고 보기"); go.href = p.url; go.target = "_blank"; go.rel = "noopener";
    const btn = el("button", applied[p.id] ? "done" : "", applied[p.id] ? "✓ 지원완료 (취소)" : "지원완료");
    btn.onclick = () => { if (applied[p.id]) delete applied[p.id]; else applied[p.id] = Date.now(); save(); render(); };
    act.append(go, btn);
    c.append(top, head, dl, act);
    list.append(c);
  }
}
document.getElementById("tNew").onclick = () => { view = "new"; render(); };
document.getElementById("tDone").onclick = () => { view = "done"; render(); };
render();
</script>
</body>
</html>
